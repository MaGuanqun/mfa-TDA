# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # Project recipes are registered by create-env.sh before concretization.
  specs:
  - mpich@4
  - tbb
  - eigen
  - mfa~examples~tests thread=tbb
  - libtorch
  - mfa_tda.tetgen@1.6.0
  - mfa_tda.earcut-hpp@2.2.4

  view: true

  concretizer:
    unify: true  # fixes concretization error if mfa is undeclared
